name: Autofix Monitor

on:
  workflow_dispatch:
    inputs:
      applyFixes:
        description: Commit và push các lint fix an toàn nếu có
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */6 * * *'

jobs:
  autofix-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply safe lint fixes
        run: npm run autofix:fix

      - name: Build app
        run: npm run build

      - name: Generate autofix report
        env:
          SCRAPER_CONTROL_URL: ${{ vars.SCRAPER_CONTROL_URL }}
          AUTOFIX_REPORT_PATH: tmp/autofix-report.json
        run: npm run autofix:report

      - name: Upload autofix report
        uses: actions/upload-artifact@v5
        with:
          name: autofix-report
          path: tmp/autofix-report.json

      - name: Commit lint autofixes
        if: github.event_name == 'workflow_dispatch' && inputs.applyFixes == true
        run: |
          if git diff --quiet; then
            echo "No autofix changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply autofix updates"
          git push
