name: Autofix Monitor

on:
  workflow_dispatch:
    inputs:
      applyFixes:
        description: Commit và push các lint fix an toàn nếu có
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: autofix-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply safe lint fixes
        run: npm run autofix:fix

      - name: Build app
        run: npm run build

      - name: Generate autofix report
        env:
          SCRAPER_CONTROL_URL: ${{ vars.SCRAPER_CONTROL_URL }}
          AUTOFIX_REPORT_PATH: tmp/autofix-report.json
        run: npm run autofix:report

      - name: Publish job summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs')
          const summaryPath = process.env.GITHUB_STEP_SUMMARY
          const reportPath = 'tmp/autofix-report.json'

          if (!fs.existsSync(reportPath)) {
            fs.appendFileSync(summaryPath, '## Autofix Report\n\nReport file not found.\n')
            process.exit(0)
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
          const checks = Array.isArray(report.checks) ? report.checks : []
          const lines = [
            '## Autofix Report',
            '',
            `- Generated: ${report.generatedAt ?? '-'}`,
            `- Repo version: ${report.repoVersion ?? '-'}`,
            `- Pass: ${report.summary?.pass ?? 0}`,
            `- Warn: ${report.summary?.warn ?? 0}`,
            `- Fail: ${report.summary?.fail ?? 0}`,
            `- Skip: ${report.summary?.skip ?? 0}`,
            '',
            '| Check | Status | Summary |',
            '| --- | --- | --- |',
            ...checks.map((check) => `| ${String(check.name ?? '-')} | ${String(check.status ?? '-')} | ${String(check.summary ?? '-').replace(/\n/g, ' ')} |`),
            '',
            '### Raw report JSON',
            '',
            '```json',
            JSON.stringify(report, null, 2),
            '```',
          ]

          fs.appendFileSync(summaryPath, `${lines.join('\n')}\n`)
          NODE

      - name: Commit lint autofixes
        if: github.event_name == 'workflow_dispatch' && inputs.applyFixes == true
        run: |
          if git diff --quiet; then
            echo "No autofix changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply autofix updates"
          git push
